name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff celery[redis] moto[s3]
      - name: Ruff
        run: ruff check api tests config ingestion chunking embeddings generation retrieval vectorstore parsers main.py
      - name: Pytest unit
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars-min
          GEMINI_API_KEY: test-gemini-api-key
          INGESTION_RUN_INLINE: "true"
        run: pytest -q -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnidocs
          POSTGRES_PASSWORD: omnidocs
          POSTGRES_DB: omnidocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidocs -d omnidocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install celery[redis] moto[s3]
      - name: Alembic migrate
        env:
          DATABASE_URL: postgresql+psycopg://omnidocs:omnidocs@localhost:5432/omnidocs
        run: alembic upgrade head
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://omnidocs:omnidocs@localhost:5432/omnidocs
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars-min
          GEMINI_API_KEY: test-gemini-api-key
          RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
          INGESTION_RUN_INLINE: "true"
        run: pytest -q -m integration tests/test_migrations.py tests/test_rate_limit_redis.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnidocs
          POSTGRES_PASSWORD: omnidocs
          POSTGRES_DB: omnidocs
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install celery[redis]
      - name: Migrate and start API
        env:
          DATABASE_URL: postgresql+psycopg://omnidocs:omnidocs@localhost:5432/omnidocs
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars-min
          GEMINI_API_KEY: test-gemini-api-key
          RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          INGESTION_RUN_INLINE: "true"
        run: |
          alembic upgrade head
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e:ci
