services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: omnidocs-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - omnidocs_data:/app/data
      - omnidocs_chroma:/app/chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: omnidocs-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  omnidocs_data:
  omnidocs_chroma:
